<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Growe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <h1>🌱 Growe Admin</h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Back to Site</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="admin-panel">
        <div class="container">
            <h1>Product Management</h1>
            
            <div class="admin-sections">
                <div class="add-product-section">
                    <h2>Add New Product</h2>
                    <form id="add-product-form">
                        <div class="form-group">
                            <label for="product-name">Product Name:</label>
                            <input type="text" id="product-name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="product-category">Category:</label>
                            <select id="product-category" required>
                                <option value="vegetables">Vegetables</option>
                                <option value="herbs">Herbs</option>
                                <option value="flowers">Flowers</option>
                                <option value="fruits">Fruits</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="product-price">Price ($):</label>
                            <input type="number" id="product-price" step="0.01" min="0" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="product-description">Description:</label>
                            <textarea id="product-description" rows="4" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="product-image">Image URL:</label>
                            <input type="text" id="product-image" placeholder="🌱">
                        </div>
                        
                        <div class="form-group">
                            <label for="product-stock">Stock:</label>
                            <input type="number" id="product-stock" min="0" value="100" required>
                        </div>
                        
                        <button type="submit" class="btn-primary">Add Product</button>
                    </form>
                </div>
                
                <div class="product-list-section">
                    <h2>Current Products</h2>
                    <div class="admin-stats">
                        <div class="stat-card">
                            <h3 id="total-products">0</h3>
                            <p>Total Products</p>
                        </div>
                        <div class="stat-card">
                            <h3 id="total-categories">0</h3>
                            <p>Categories</p>
                        </div>
                    </div>
                    
                    <div id="admin-products-list" class="admin-products">
                        <!-- Products will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 Growe Admin Panel. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
